<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Survivor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        #game-container { position: relative; }
        canvas { border: 3px solid #4a4a6a; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 1024;
        const GAME_HEIGHT = 768;
        const WORLD_WIDTH = 2000;
        const WORLD_HEIGHT = 2000;

        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // ========================================
        // Sound System (Web Audio API)
        // ========================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            switch(type) {
                case 'shoot':
                    oscillator.frequency.setValueAtTime(800, now);
                    oscillator.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    oscillator.type = 'square';
                    oscillator.start(now);
                    oscillator.stop(now + 0.1);
                    break;
                case 'hit':
                    oscillator.frequency.setValueAtTime(200, now);
                    oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    oscillator.type = 'sawtooth';
                    oscillator.start(now);
                    oscillator.stop(now + 0.15);
                    break;
                case 'collect':
                    oscillator.frequency.setValueAtTime(523, now);
                    oscillator.frequency.setValueAtTime(659, now + 0.1);
                    oscillator.frequency.setValueAtTime(784, now + 0.2);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    oscillator.type = 'sine';
                    oscillator.start(now);
                    oscillator.stop(now + 0.3);
                    break;
                case 'damage':
                    oscillator.frequency.setValueAtTime(150, now);
                    oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    oscillator.type = 'sawtooth';
                    oscillator.start(now);
                    oscillator.stop(now + 0.2);
                    break;
                case 'levelup':
                    oscillator.frequency.setValueAtTime(400, now);
                    oscillator.frequency.setValueAtTime(500, now + 0.1);
                    oscillator.frequency.setValueAtTime(600, now + 0.2);
                    oscillator.frequency.setValueAtTime(800, now + 0.3);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    oscillator.type = 'sine';
                    oscillator.start(now);
                    oscillator.stop(now + 0.4);
                    break;
                case 'kill':
                    oscillator.frequency.setValueAtTime(300, now);
                    oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                    gainNode.gain.setValueAtTime(0.08, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    oscillator.type = 'triangle';
                    oscillator.start(now);
                    oscillator.stop(now + 0.1);
                    break;
            }
        }

        // Initialize audio on first user interaction
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('keydown', initAudio, { once: true });

        // ========================================
        // Game State
        // ========================================
        const game = {
            running: true,
            score: 0,
            time: 0,
            wave: 1,
            camera: { x: 0, y: 0 }
        };

        // ========================================
        // Player (EASIER - more HP, faster)
        // ========================================
        const player = {
            x: WORLD_WIDTH / 2,
            y: WORLD_HEIGHT / 2,
            size: 32,
            speed: 6,  // Increased from 5
            hp: 150,   // Increased from 100
            maxHp: 150,
            attack: 30, // Increased from 25
            attackSpeed: 400, // Faster attacks
            attackRange: 180, // Larger range
            lastAttack: 0,
            invincible: false,
            invincibleTime: 0,
            weaponSlots: 5,
            abilities: []
        };

        // ========================================
        // Enemies (EASIER - slower, less damage)
        // ========================================
        let enemies = [];
        const ENEMY_TYPES = {
            normal: { size: 24, speed: 1.2, hp: 25, damage: 8, color: '#e74c3c', dropChance: 0.6 },  // Slower, less HP
            fast: { size: 18, speed: 2.5, hp: 12, damage: 5, color: '#e67e22', dropChance: 0.4 },
            tank: { size: 40, speed: 0.7, hp: 60, damage: 15, color: '#8e44ad', dropChance: 0.9 }
        };

        let spawnTimer = 0;
        const SPAWN_INTERVAL = 2500; // Slower spawn (was 1500)

        // ========================================
        // Materials
        // ========================================
        let materials = [];
        const MATERIAL_TYPES = {
            fire: { color: '#ff6b35', symbol: '🔥', name: '炎', effect: '攻撃力+15%' },
            ice: { color: '#4ecdc4', symbol: '❄️', name: '氷', effect: '敵を遅くする' },
            lightning: { color: '#f7dc6f', symbol: '⚡', name: '雷', effect: '攻撃速度+20%' },
            wind: { color: '#a8e6cf', symbol: '💨', name: '風', effect: '移動速度+25%' },
            dark: { color: '#6c5ce7', symbol: '💀', name: '闇', effect: '倒すとHP回復' }
        };

        let projectiles = [];
        let particles = [];

        // ========================================
        // Floating Text (Damage numbers, notifications)
        // ========================================
        let floatingTexts = [];

        function addFloatingText(x, y, text, color, size = 20, duration = 1000) {
            floatingTexts.push({
                x, y,
                text,
                color,
                size,
                life: 1,
                duration,
                startTime: Date.now()
            });
        }

        // ========================================
        // Notifications
        // ========================================
        let notifications = [];

        function addNotification(text, color = '#fff', duration = 2000) {
            notifications.push({
                text,
                color,
                life: 1,
                duration,
                startTime: Date.now()
            });
        }

        // ========================================
        // Input
        // ========================================
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // ========================================
        // Utility Functions
        // ========================================
        function distance(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // ========================================
        // Spawn Enemies
        // ========================================
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const margin = 150; // Spawn further away

            switch (side) {
                case 0: x = randomRange(game.camera.x - margin, game.camera.x + GAME_WIDTH + margin); y = game.camera.y - margin; break;
                case 1: x = randomRange(game.camera.x - margin, game.camera.x + GAME_WIDTH + margin); y = game.camera.y + GAME_HEIGHT + margin; break;
                case 2: x = game.camera.x - margin; y = randomRange(game.camera.y - margin, game.camera.y + GAME_HEIGHT + margin); break;
                case 3: x = game.camera.x + GAME_WIDTH + margin; y = randomRange(game.camera.y - margin, game.camera.y + GAME_HEIGHT + margin); break;
            }

            // Easier enemy type selection
            let typeKey = 'normal';
            if (game.wave >= 3 && Math.random() < 0.25) typeKey = 'fast';  // Wave 3+ for fast
            if (game.wave >= 5 && Math.random() < 0.15) typeKey = 'tank';  // Wave 5+ for tank

            const type = ENEMY_TYPES[typeKey];
            const waveMultiplier = 1 + (game.wave - 1) * 0.08; // Slower scaling

            enemies.push({
                x, y, type: typeKey, size: type.size,
                speed: type.speed * waveMultiplier,
                hp: type.hp * waveMultiplier,
                maxHp: type.hp * waveMultiplier,
                damage: type.damage,
                color: type.color,
                dropChance: type.dropChance
            });
        }

        // ========================================
        // Drop Material
        // ========================================
        function dropMaterial(x, y) {
            const types = Object.keys(MATERIAL_TYPES);
            const typeKey = randomChoice(types);
            const type = MATERIAL_TYPES[typeKey];
            materials.push({ x, y, type: typeKey, color: type.color, symbol: type.symbol, size: 20, lifetime: 15000, bobOffset: Math.random() * Math.PI * 2 });
        }

        // ========================================
        // Particles
        // ========================================
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, vx: randomRange(-3, 3), vy: randomRange(-3, 3), size: randomRange(3, 8), color, life: 1 });
            }
        }

        // ========================================
        // Auto Attack
        // ========================================
        function autoAttack(timestamp) {
            if (timestamp - player.lastAttack < player.attackSpeed) return;
            let nearest = null;
            let nearestDist = player.attackRange;
            for (const enemy of enemies) {
                const dist = distance(player, enemy);
                if (dist < nearestDist) { nearest = enemy; nearestDist = dist; }
            }
            if (nearest) {
                player.lastAttack = timestamp;
                const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                projectiles.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle) * 14, // Faster projectiles
                    vy: Math.sin(angle) * 14,
                    size: 10, // Bigger
                    damage: player.attack,
                    color: '#f39c12',
                    life: 1
                });
                playSound('shoot');
            }
        }

        // ========================================
        // Update Functions
        // ========================================
        function updatePlayer() {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
            player.x += dx * player.speed;
            player.y += dy * player.speed;
            player.x = Math.max(player.size, Math.min(WORLD_WIDTH - player.size, player.x));
            player.y = Math.max(player.size, Math.min(WORLD_HEIGHT - player.size, player.y));
            if (player.invincible && Date.now() > player.invincibleTime) player.invincible = false;
        }

        function updateCamera() {
            const targetX = player.x - GAME_WIDTH / 2;
            const targetY = player.y - GAME_HEIGHT / 2;
            game.camera.x += (targetX - game.camera.x) * 0.08; // Smoother
            game.camera.y += (targetY - game.camera.y) * 0.08;
            game.camera.x = Math.max(0, Math.min(WORLD_WIDTH - GAME_WIDTH, game.camera.x));
            game.camera.y = Math.max(0, Math.min(WORLD_HEIGHT - GAME_HEIGHT, game.camera.y));
        }

        function updateEnemies() {
            // Apply ice slow effect
            const hasIce = player.abilities.some(a => a.type === 'ice');

            for (const enemy of enemies) {
                const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                let speed = enemy.speed;
                if (hasIce) speed *= 0.6; // Ice slows enemies

                enemy.x += Math.cos(angle) * speed;
                enemy.y += Math.sin(angle) * speed;

                if (!player.invincible && distance(player, enemy) < player.size + enemy.size / 2) {
                    player.hp -= enemy.damage;
                    player.invincible = true;
                    player.invincibleTime = Date.now() + 800; // Longer invincibility
                    createParticles(player.x, player.y, '#e74c3c', 15);
                    addFloatingText(player.x, player.y - 30, `-${enemy.damage}`, '#e74c3c', 28);
                    playSound('damage');
                    if (player.hp <= 0) gameOver();
                }
            }
        }

        function updateProjectiles() {
            const hasDark = player.abilities.some(a => a.type === 'dark');

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.015;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (distance(p, enemy) < p.size + enemy.size / 2) {
                        enemy.hp -= p.damage;
                        createParticles(enemy.x, enemy.y, enemy.color, 5);
                        addFloatingText(enemy.x, enemy.y - 20, Math.round(p.damage).toString(), '#fff', 16);
                        playSound('hit');

                        if (enemy.hp <= 0) {
                            game.score += 10;
                            createParticles(enemy.x, enemy.y, enemy.color, 20);
                            playSound('kill');

                            // Dark ability: heal on kill
                            if (hasDark) {
                                const healAmount = 5;
                                player.hp = Math.min(player.maxHp, player.hp + healAmount);
                                addFloatingText(player.x, player.y - 40, `+${healAmount}`, '#2ecc71', 18);
                            }

                            if (Math.random() < enemy.dropChance) dropMaterial(enemy.x, enemy.y);
                            enemies.splice(j, 1);
                        }
                        projectiles.splice(i, 1);
                        break;
                    }
                }
                if (p.life <= 0) projectiles.splice(i, 1);
            }
        }

        function updateMaterials() {
            for (let i = materials.length - 1; i >= 0; i--) {
                const m = materials[i];
                m.lifetime -= 16;
                if (distance(player, m) < player.size + m.size + 10) { // Easier pickup
                    collectMaterial(m);
                    materials.splice(i, 1);
                    continue;
                }
                if (m.lifetime <= 0) materials.splice(i, 1);
            }
        }

        function collectMaterial(material) {
            const type = MATERIAL_TYPES[material.type];
            game.score += 25;
            playSound('collect');

            if (player.abilities.length < player.weaponSlots) {
                player.abilities.push({ type: material.type, ...type });
                applyAbilityEffects();
                addNotification(`${type.symbol} ${type.name}を獲得！ ${type.effect}`, type.color);
                addFloatingText(player.x, player.y - 50, `+${type.name}`, type.color, 24);
            } else {
                addNotification('スロットがいっぱいです！', '#e74c3c');
            }
            createParticles(material.x, material.y, material.color, 15);
        }

        function applyAbilityEffects() {
            // Reset to base stats
            player.attack = 30;
            player.speed = 6;
            player.attackSpeed = 400;

            for (const ability of player.abilities) {
                switch (ability.type) {
                    case 'fire': player.attack *= 1.15; break;
                    case 'wind': player.speed *= 1.25; break;
                    case 'lightning': player.attackSpeed *= 0.8; break;
                    // ice and dark are handled in combat
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.03; p.size *= 0.95;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateFloatingTexts() {
            const now = Date.now();
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                const elapsed = now - ft.startTime;
                ft.life = 1 - (elapsed / ft.duration);
                ft.y -= 1; // Float upward
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function updateNotifications() {
            const now = Date.now();
            for (let i = notifications.length - 1; i >= 0; i--) {
                const n = notifications[i];
                const elapsed = now - n.startTime;
                n.life = 1 - (elapsed / n.duration);
                if (n.life <= 0) notifications.splice(i, 1);
            }
        }

        let lastWave = 1;
        function updateWave() {
            const newWave = Math.floor(game.time / 45000) + 1; // 45 seconds per wave (was 30)
            if (newWave > game.wave) {
                game.wave = newWave;
                addNotification(`⚔️ Wave ${game.wave} 開始！`, '#e74c3c', 3000);
                playSound('levelup');
            }
        }

        // ========================================
        // Draw Functions
        // ========================================
        function drawBackground() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.strokeStyle = '#2a2a4e'; ctx.lineWidth = 1;
            const gridSize = 64;
            const startX = -game.camera.x % gridSize;
            const startY = -game.camera.y % gridSize;
            for (let x = startX; x < GAME_WIDTH; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GAME_HEIGHT); ctx.stroke(); }
            for (let y = startY; y < GAME_HEIGHT; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_WIDTH, y); ctx.stroke(); }
        }

        function drawPlayer() {
            const screenX = player.x - game.camera.x;
            const screenY = player.y - game.camera.y;

            // Attack range indicator
            ctx.strokeStyle = 'rgba(243, 156, 18, 0.15)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(screenX, screenY, player.attackRange, 0, Math.PI * 2); ctx.stroke();

            ctx.save();
            if (player.invincible) ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;

            // Player glow
            ctx.shadowColor = '#3498db';
            ctx.shadowBlur = 20;

            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(screenX, screenY, player.size / 2, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5dade2'; ctx.beginPath(); ctx.arc(screenX - 5, screenY - 5, player.size / 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawEnemies() {
            for (const enemy of enemies) {
                const screenX = enemy.x - game.camera.x;
                const screenY = enemy.y - game.camera.y;
                if (screenX < -50 || screenX > GAME_WIDTH + 50 || screenY < -50 || screenY > GAME_HEIGHT + 50) continue;

                ctx.fillStyle = enemy.color;
                ctx.beginPath(); ctx.arc(screenX, screenY, enemy.size / 2, 0, Math.PI * 2); ctx.fill();

                // HP bar
                const hpPercent = enemy.hp / enemy.maxHp;
                ctx.fillStyle = '#333'; ctx.fillRect(screenX - enemy.size / 2, screenY - enemy.size / 2 - 10, enemy.size, 4);
                ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : hpPercent > 0.25 ? '#f1c40f' : '#e74c3c';
                ctx.fillRect(screenX - enemy.size / 2, screenY - enemy.size / 2 - 10, enemy.size * hpPercent, 4);
            }
        }

        function drawProjectiles() {
            for (const p of projectiles) {
                const screenX = p.x - game.camera.x; const screenY = p.y - game.camera.y;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function drawMaterials() {
            for (const m of materials) {
                const screenX = m.x - game.camera.x; const screenY = m.y - game.camera.y;
                if (screenX < -50 || screenX > GAME_WIDTH + 50 || screenY < -50 || screenY > GAME_HEIGHT + 50) continue;
                const bob = Math.sin(Date.now() * 0.005 + m.bobOffset) * 5;
                ctx.shadowColor = m.color; ctx.shadowBlur = 20;
                ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(m.symbol, screenX, screenY + bob);
                ctx.shadowBlur = 0;
            }
        }

        function drawParticles() {
            for (const p of particles) {
                const screenX = p.x - game.camera.x; const screenY = p.y - game.camera.y;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function drawFloatingTexts() {
            for (const ft of floatingTexts) {
                const screenX = ft.x - game.camera.x;
                const screenY = ft.y - game.camera.y;
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.font = `bold ${ft.size}px Segoe UI`;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, screenX, screenY);
                ctx.globalAlpha = 1;
            }
        }

        function drawNotifications() {
            let y = 150;
            for (const n of notifications) {
                ctx.globalAlpha = n.life;
                ctx.fillStyle = n.color;
                ctx.font = 'bold 20px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(n.text, GAME_WIDTH / 2, y);
                ctx.globalAlpha = 1;
                y += 30;
            }
        }

        function drawUI() {
            // HP Bar
            const hpBarWidth = 250, hpBarHeight = 24, hpPercent = player.hp / player.maxHp;
            ctx.fillStyle = '#333'; ctx.fillRect(20, 20, hpBarWidth, hpBarHeight);
            ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : hpPercent > 0.25 ? '#f1c40f' : '#e74c3c';
            ctx.fillRect(20, 20, hpBarWidth * hpPercent, hpBarHeight);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(20, 20, hpBarWidth, hpBarHeight);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText(`❤️ ${Math.ceil(player.hp)} / ${player.maxHp}`, 20 + hpBarWidth / 2, 37);

            // Score & Wave
            ctx.textAlign = 'left'; ctx.font = 'bold 24px Segoe UI';
            ctx.fillStyle = '#f1c40f'; ctx.fillText(`⭐ Score: ${game.score}`, 20, 70);
            ctx.fillStyle = '#e74c3c'; ctx.fillText(`⚔️ Wave ${game.wave}`, 20, 100);
            ctx.fillStyle = '#9b59b6'; ctx.font = '18px Segoe UI'; ctx.fillText(`👾 Enemies: ${enemies.length}`, 20, 130);

            // Stats
            ctx.fillStyle = '#3498db'; ctx.font = '14px Segoe UI';
            ctx.fillText(`ATK: ${Math.round(player.attack)} | SPD: ${player.speed.toFixed(1)} | AS: ${player.attackSpeed}ms`, 20, 155);

            drawAbilitySlots();

            // Controls hint
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '14px Segoe UI'; ctx.textAlign = 'right';
            ctx.fillText('WASD / Arrow Keys で移動 | 攻撃は自動', GAME_WIDTH - 20, GAME_HEIGHT - 20);
        }

        function drawAbilitySlots() {
            const slotSize = 50;
            const startX = GAME_WIDTH - 20 - slotSize * player.weaponSlots - 10 * (player.weaponSlots - 1);

            ctx.fillStyle = '#fff'; ctx.font = '14px Segoe UI'; ctx.textAlign = 'right';
            ctx.fillText('🎒 アビリティ', GAME_WIDTH - 20, 15);

            for (let i = 0; i < player.weaponSlots; i++) {
                const x = startX + i * (slotSize + 10);
                ctx.fillStyle = '#2a2a4e'; ctx.fillRect(x, 25, slotSize, slotSize);
                ctx.strokeStyle = player.abilities[i] ? '#f1c40f' : '#4a4a6a';
                ctx.lineWidth = 2; ctx.strokeRect(x, 25, slotSize, slotSize);
                if (player.abilities[i]) {
                    ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(player.abilities[i].symbol, x + slotSize / 2, 25 + slotSize / 2);
                }
            }
        }

        // ========================================
        // Game Over
        // ========================================
        let gameOverScreen = false;
        function gameOver() { game.running = false; gameOverScreen = true; }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 72px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText('💀 GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 80);
            ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 36px Segoe UI';
            ctx.fillText(`⭐ Score: ${game.score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2);
            ctx.fillStyle = '#9b59b6'; ctx.font = '24px Segoe UI';
            ctx.fillText(`Wave ${game.wave} まで到達`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
            ctx.fillStyle = '#fff'; ctx.font = '20px Segoe UI';
            ctx.fillText('🔄 SPACE でリスタート', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 120);
        }

        function restart() {
            player.x = WORLD_WIDTH / 2; player.y = WORLD_HEIGHT / 2;
            player.hp = player.maxHp; player.abilities = [];
            player.attack = 30; player.speed = 6; player.attackSpeed = 400;
            enemies = []; materials = []; projectiles = []; particles = [];
            floatingTexts = []; notifications = [];
            game.score = 0; game.time = 0; game.wave = 1;
            game.running = true; gameOverScreen = false;
            addNotification('🎮 ゲームスタート！敵を倒して素材を集めよう！', '#2ecc71', 3000);
        }

        window.addEventListener('keydown', e => { if (e.code === 'Space' && gameOverScreen) restart(); });

        // ========================================
        // Game Loop
        // ========================================
        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime; lastTime = timestamp;

            if (game.running) {
                game.time += deltaTime;
                spawnTimer += deltaTime;
                const spawnInterval = Math.max(800, SPAWN_INTERVAL - game.wave * 80); // Slower scaling
                if (spawnTimer >= spawnInterval) {
                    const spawnCount = Math.min(1 + Math.floor(game.wave / 3), 4); // Less enemies
                    for (let i = 0; i < spawnCount; i++) spawnEnemy();
                    spawnTimer = 0;
                }
                updatePlayer(); updateCamera(); updateEnemies();
                autoAttack(timestamp); updateProjectiles();
                updateMaterials(); updateParticles();
                updateFloatingTexts(); updateNotifications();
                updateWave();
            }

            drawBackground(); drawMaterials(); drawEnemies();
            drawProjectiles(); drawPlayer(); drawParticles();
            drawFloatingTexts(); drawUI(); drawNotifications();
            if (gameOverScreen) drawGameOver();

            requestAnimationFrame(gameLoop);
        }

        // Start
        addNotification('🎮 ゲームスタート！敵を倒して素材を集めよう！', '#2ecc71', 3000);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
