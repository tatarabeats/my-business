<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>複利キャッチャー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ステータス表示 */
        #status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            z-index: 100;
        }

        #top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        #timer-display {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #timer-display.danger {
            color: #f87171;
            animation: timerPulse 0.5s infinite alternate;
        }

        @keyframes timerPulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #rate-display {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }

        #rate-display.negative {
            color: #f87171;
        }

        /* タイマーバー */
        #timer-bar-container {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        #timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            width: 100%;
            transition: width 0.1s linear;
        }

        #timer-bar.danger {
            background: linear-gradient(90deg, #f87171, #ef4444);
        }

        /* バケツ - 超目立たせる */
        #bucket {
            position: absolute;
            width: 130px;
            height: 60px;
            background: linear-gradient(180deg, #ffd700, #f59e0b);
            border-radius: 15px 15px 30px 30px;
            border: 5px solid #fff;
            box-shadow: 0 0 40px rgba(255, 215, 0, 1),
                        0 0 80px rgba(255, 215, 0, 0.6),
                        inset 0 -15px 25px rgba(0, 0, 0, 0.2);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bucket::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 15px;
            right: 15px;
            height: 15px;
            background: #fff;
            border-radius: 10px 10px 0 0;
        }

        #bucket-rate {
            color: #1a1a2e;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        /* 落下する数字 */
        .falling-number {
            position: absolute;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-width: 65px;
            pointer-events: none;
        }

        .falling-number.positive {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #fff;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.5);
        }

        .falling-number.negative {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.5);
        }

        .falling-number.bonus {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.7);
            animation: pulse 0.3s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* キャッチエフェクト */
        .catch-effect {
            position: absolute;
            pointer-events: none;
            font-size: 28px;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 200;
        }

        .catch-effect.positive { color: #4ade80; }
        .catch-effect.negative { color: #f87171; }
        .catch-effect.bonus { color: #ffd700; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        /* 画面 */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }

        .screen.hidden {
            display: none !important;
        }

        /* スタート画面 */
        #start-screen h1 {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #start-screen .subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 20px;
        }

        #start-screen .highscore {
            font-size: 16px;
            color: #4ade80;
            margin-bottom: 25px;
        }

        #start-screen .rules {
            text-align: left;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 2;
            max-width: 280px;
        }

        .rules span.green { color: #4ade80; }
        .rules span.red { color: #f87171; }
        .rules span.gold { color: #ffd700; }

        .btn {
            padding: 18px 50px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        /* 複利フェーズ画面 */
        #compound-screen {
            background: rgba(0, 0, 0, 0.95);
        }

        #compound-screen h2 {
            font-size: 24px;
            color: #4ade80;
            margin-bottom: 10px;
        }

        #compound-screen .compound-rate {
            font-size: 42px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        #compound-screen .compound-money {
            font-size: 48px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
            transition: all 0.1s;
        }

        #compound-screen .compound-money.growing {
            transform: scale(1.08);
            color: #4ade80;
        }

        #compound-screen .compound-label {
            font-size: 14px;
            color: #888;
        }

        /* リザルト画面 */
        #result-screen h2 {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        #result-screen .result-money {
            font-size: 48px;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #result-screen .new-record {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 15px;
            animation: recordPulse 0.5s infinite alternate;
        }

        @keyframes recordPulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.1); opacity: 0.8; }
        }

        #result-screen .result-stats {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        #result-screen .message {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* カウントダウン */
        #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            z-index: 300;
            animation: countPop 0.5s ease-out;
        }

        @keyframes countPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <h1>複利キャッチャー</h1>
        <p class="subtitle">21秒で最高金額を目指せ！</p>
        <p class="highscore">ハイスコア: <span id="highscore-display">¥100</span></p>
        <div class="rules">
            <span class="gold">■ 金のバケツ</span>を左右に動かせ<br>
            <span class="green">■ 緑</span>と<span class="gold">金</span>をキャッチ！<br>
            <span class="red">■ 赤</span>は避けろ（利率ダウン）<br>
            21秒後、複利で資産が爆増！
        </div>
        <button class="btn btn-start" onclick="startGame()">START</button>
    </div>

    <!-- 複利フェーズ画面 -->
    <div id="compound-screen" class="screen hidden">
        <h2>複利タイム</h2>
        <div class="compound-rate">+0.0%</div>
        <div class="compound-money">¥100</div>
        <div class="compound-label">10年分の複利を体感...</div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen hidden">
        <h2>結果発表</h2>
        <div class="result-money">¥100</div>
        <div class="new-record hidden">NEW RECORD!</div>
        <div class="result-stats"></div>
        <p class="message"></p>
        <button class="btn btn-start" onclick="startGame()">もう一回</button>
    </div>

    <!-- カウントダウン -->
    <div id="countdown" class="hidden"></div>

    <!-- ゲーム画面 -->
    <div id="game-container">
        <div id="status">
            <div id="top-row">
                <div id="timer-display">21</div>
                <div id="rate-display">+0%</div>
            </div>
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
        </div>
        <div id="bucket">
            <span id="bucket-rate">+0%</span>
        </div>
    </div>

    <script>
        // ゲーム設定
        const CONFIG = {
            INITIAL_MONEY: 100,
            GAME_DURATION: 21,
            COMPOUND_YEARS: 10, // 10年分の複利
            SPAWN_INTERVAL: 500,
            FALL_SPEED: 4,
            BUCKET_WIDTH: 130,
            BUCKET_HEIGHT: 60,
        };

        // ハイスコア
        let highScore = parseInt(localStorage.getItem('fukuri-highscore')) || CONFIG.INITIAL_MONEY;

        // サウンド
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch(type) {
                case 'catch':
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'bonus':
                    oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.35);
                    break;
                case 'negative':
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'compound':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440 + Math.random() * 200, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'countdown':
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'start':
                    oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'finish':
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc1.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
                    osc1.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3);
                    osc1.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.45);
                    gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc1.start(audioCtx.currentTime);
                    osc1.stop(audioCtx.currentTime + 0.6);
                    break;
            }
        }

        // ゲーム状態
        let gameState = {
            rate: 0,
            phase: 'idle',
            timeLeft: CONFIG.GAME_DURATION,
            fallingNumbers: [],
            bucketX: 0,
            bucketY: 0,
            spawnTimer: null,
            gameTimer: null,
            animationFrame: null,
        };

        // DOM要素
        const elements = {
            startScreen: document.getElementById('start-screen'),
            compoundScreen: document.getElementById('compound-screen'),
            resultScreen: document.getElementById('result-screen'),
            countdown: document.getElementById('countdown'),
            gameContainer: document.getElementById('game-container'),
            timerDisplay: document.getElementById('timer-display'),
            rateDisplay: document.getElementById('rate-display'),
            timerBar: document.getElementById('timer-bar'),
            bucket: document.getElementById('bucket'),
            bucketRate: document.getElementById('bucket-rate'),
            highscoreDisplay: document.getElementById('highscore-display'),
        };

        // ハイスコア表示を更新
        function updateHighscoreDisplay() {
            elements.highscoreDisplay.textContent = formatMoney(highScore);
        }

        // バケツ操作
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let bucketStartX = 0;
        let bucketStartY = 0;

        function initBucket() {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            gameState.bucketX = (containerWidth - CONFIG.BUCKET_WIDTH) / 2;
            // 画面の60%の位置にバケツを配置（上から）
            gameState.bucketY = containerHeight * 0.60;
            updateBucketPosition();
        }

        function updateBucketPosition() {
            elements.bucket.style.left = gameState.bucketX + 'px';
            elements.bucket.style.top = gameState.bucketY + 'px';
        }

        function handleDragStart(e) {
            if (gameState.phase !== 'collect') return;
            isDragging = true;
            const touch = e.type.includes('mouse') ? e : e.touches[0];
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            bucketStartX = gameState.bucketX;
            bucketStartY = gameState.bucketY;
        }

        function handleDragMove(e) {
            if (!isDragging || gameState.phase !== 'collect') return;
            e.preventDefault();

            const touch = e.type.includes('mouse') ? e : e.touches[0];
            const currentX = touch.clientX;
            const currentY = touch.clientY;
            const deltaX = currentX - dragStartX;
            const deltaY = currentY - dragStartY;

            // X座標の制限
            const maxX = window.innerWidth - CONFIG.BUCKET_WIDTH;
            let newX = Math.max(0, Math.min(maxX, bucketStartX + deltaX));

            // Y座標の制限（画面の50%〜85%の範囲で動ける）
            const minY = window.innerHeight * 0.50;
            const maxY = window.innerHeight * 0.85;
            let newY = Math.max(minY, Math.min(maxY, bucketStartY + deltaY));

            gameState.bucketX = newX;
            gameState.bucketY = newY;
            updateBucketPosition();
        }

        function handleDragEnd() {
            isDragging = false;
        }

        // イベントリスナー
        document.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);
        document.addEventListener('touchstart', handleDragStart, { passive: false });
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);

        // ゲーム開始
        function startGame() {
            initAudio();

            gameState = {
                rate: 0,
                phase: 'idle',
                timeLeft: CONFIG.GAME_DURATION,
                fallingNumbers: [],
                bucketX: gameState.bucketX,
                bucketY: gameState.bucketY,
                spawnTimer: null,
                gameTimer: null,
                animationFrame: null,
            };

            document.querySelectorAll('.falling-number, .catch-effect').forEach(el => el.remove());

            elements.startScreen.classList.add('hidden');
            elements.resultScreen.classList.add('hidden');
            elements.compoundScreen.classList.add('hidden');

            initBucket();
            updateUI();

            // カウントダウン開始
            startCountdown();
        }

        // カウントダウン
        function startCountdown() {
            let count = 3;
            elements.countdown.classList.remove('hidden');
            elements.countdown.textContent = count;
            playSound('countdown');

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    elements.countdown.textContent = count;
                    elements.countdown.style.animation = 'none';
                    elements.countdown.offsetHeight;
                    elements.countdown.style.animation = 'countPop 0.5s ease-out';
                    playSound('countdown');
                } else {
                    elements.countdown.textContent = 'GO!';
                    elements.countdown.style.animation = 'none';
                    elements.countdown.offsetHeight;
                    elements.countdown.style.animation = 'countPop 0.5s ease-out';
                    playSound('start');
                    clearInterval(countInterval);
                    setTimeout(() => {
                        elements.countdown.classList.add('hidden');
                        startCollectPhase();
                    }, 500);
                }
            }, 700);
        }

        // 収集フェーズ開始
        function startCollectPhase() {
            gameState.phase = 'collect';
            gameState.timeLeft = CONFIG.GAME_DURATION;

            gameState.spawnTimer = setInterval(spawnNumber, CONFIG.SPAWN_INTERVAL);
            gameState.gameTimer = setInterval(updateTimer, 100);
            gameLoop();
        }

        // タイマー更新
        function updateTimer() {
            gameState.timeLeft -= 0.1;

            if (gameState.timeLeft <= 0) {
                gameState.timeLeft = 0;
                endCollectPhase();
            }

            updateUI();
        }

        // 収集フェーズ終了
        function endCollectPhase() {
            clearInterval(gameState.spawnTimer);
            clearInterval(gameState.gameTimer);
            cancelAnimationFrame(gameState.animationFrame);

            document.querySelectorAll('.falling-number').forEach(el => el.remove());
            gameState.fallingNumbers = [];

            playSound('finish');
            startCompoundPhase();
        }

        // 複利フェーズ
        function startCompoundPhase() {
            gameState.phase = 'compound';

            const compoundScreen = elements.compoundScreen;
            compoundScreen.classList.remove('hidden');
            compoundScreen.querySelector('.compound-rate').textContent =
                `年利 ${gameState.rate >= 0 ? '+' : ''}${(gameState.rate * 100).toFixed(1)}%`;

            let money = CONFIG.INITIAL_MONEY;
            let year = 0;
            const totalYears = CONFIG.COMPOUND_YEARS;

            const moneyEl = compoundScreen.querySelector('.compound-money');
            const labelEl = compoundScreen.querySelector('.compound-label');

            moneyEl.textContent = formatMoney(money);
            labelEl.textContent = `${year}年目...`;

            const compoundInterval = setInterval(() => {
                year++;
                money *= (1 + gameState.rate);

                playSound('compound');

                moneyEl.textContent = formatMoney(money);
                moneyEl.classList.add('growing');
                setTimeout(() => moneyEl.classList.remove('growing'), 100);

                labelEl.textContent = `${year}年目...`;

                if (year >= totalYears) {
                    clearInterval(compoundInterval);
                    labelEl.textContent = `${totalYears}年後の資産！`;
                    setTimeout(() => {
                        compoundScreen.classList.add('hidden');
                        showResult(money);
                    }, 1000);
                }
            }, 300);
        }

        // 結果表示
        function showResult(finalMoney) {
            gameState.phase = 'idle';

            const isNewRecord = finalMoney > highScore;
            if (isNewRecord) {
                highScore = Math.floor(finalMoney);
                localStorage.setItem('fukuri-highscore', highScore);
                updateHighscoreDisplay();
            }

            const resultScreen = elements.resultScreen;
            resultScreen.querySelector('.result-money').textContent = formatMoney(finalMoney);

            const newRecordEl = resultScreen.querySelector('.new-record');
            if (isNewRecord) {
                newRecordEl.classList.remove('hidden');
            } else {
                newRecordEl.classList.add('hidden');
            }

            resultScreen.querySelector('.result-stats').innerHTML = `
                最終利率: ${gameState.rate >= 0 ? '+' : ''}${(gameState.rate * 100).toFixed(1)}%/年<br>
                ハイスコア: ${formatMoney(highScore)}
            `;

            let message = '';
            if (finalMoney >= 10000000) {
                message = '複利の魔法使い！\n10年で100円が' + formatMoney(finalMoney) + 'に！';
            } else if (finalMoney >= 1000000) {
                message = '複利の力、感じたか？\nコツコツが大事。';
            } else if (finalMoney >= 10000) {
                message = 'まあまあだな。\n次はもっと緑を集めろ！';
            } else if (finalMoney >= CONFIG.INITIAL_MONEY) {
                message = 'プラスで終われた。\nでも、もっといけるはず！';
            } else {
                message = 'マイナス金利の恐怖...\n赤を避けろ！';
            }
            resultScreen.querySelector('.message').textContent = message;

            resultScreen.classList.remove('hidden');
        }

        // 数字を生成
        function spawnNumber() {
            if (gameState.phase !== 'collect') return;

            const gameArea = elements.gameContainer.getBoundingClientRect();
            const statusHeight = document.getElementById('status').offsetHeight;

            // 複数同時に落とす
            const numToSpawn = Math.random() < 0.4 ? 2 : 1;

            for (let i = 0; i < numToSpawn; i++) {
                const rand = Math.random();
                let type, value;

                if (rand < 0.08) {
                    type = 'bonus';
                    value = Math.floor(Math.random() * 10 + 10); // 10-19%
                } else if (rand < 0.30) {
                    type = 'negative';
                    value = -Math.floor(Math.random() * 8 + 3); // -3 to -10%
                } else {
                    type = 'positive';
                    value = Math.floor(Math.random() * 5 + 1); // 1-5%
                }

                const el = document.createElement('div');
                el.className = `falling-number ${type}`;
                el.textContent = (value > 0 ? '+' : '') + value + '%';

                const xPos = Math.random() * (gameArea.width - 70);
                el.style.left = xPos + 'px';
                el.style.top = statusHeight + 'px';

                elements.gameContainer.appendChild(el);

                gameState.fallingNumbers.push({
                    element: el,
                    value: value,
                    type: type,
                    x: xPos,
                    y: statusHeight,
                });
            }
        }

        // ゲームループ
        function gameLoop() {
            if (gameState.phase !== 'collect') return;

            const gameArea = elements.gameContainer.getBoundingClientRect();
            const bucketTop = gameState.bucketY;
            const bucketBottom = bucketTop + CONFIG.BUCKET_HEIGHT;
            const bucketLeft = gameState.bucketX;
            const bucketRight = bucketLeft + CONFIG.BUCKET_WIDTH;

            gameState.fallingNumbers.forEach((num, index) => {
                num.y += CONFIG.FALL_SPEED;
                num.element.style.top = num.y + 'px';

                const numCenterX = num.x + 32;
                const numBottom = num.y + 50;

                // バケツとの衝突判定（Y座標ベース）
                if (numBottom >= bucketTop && numBottom <= bucketBottom + 20) {
                    if (numCenterX >= bucketLeft && numCenterX <= bucketRight) {
                        onCatch(num, index);
                        return;
                    }
                }

                // 画面外
                if (num.y > gameArea.height) {
                    num.element.remove();
                    gameState.fallingNumbers.splice(index, 1);
                }
            });

            gameState.animationFrame = requestAnimationFrame(gameLoop);
        }

        // キャッチ処理
        function onCatch(num, index) {
            gameState.rate += num.value / 100;

            showCatchEffect(num.x + 32, num.y, num.value, num.type);

            if (num.type === 'bonus') {
                playSound('bonus');
            } else if (num.type === 'negative') {
                playSound('negative');
            } else {
                playSound('catch');
            }

            num.element.remove();
            gameState.fallingNumbers.splice(index, 1);

            updateUI();
        }

        // キャッチエフェクト
        function showCatchEffect(x, y, value, type) {
            const effect = document.createElement('div');
            effect.className = `catch-effect ${type}`;
            effect.textContent = (value > 0 ? '+' : '') + value + '%';
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';
            elements.gameContainer.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
        }

        // UI更新
        function updateUI() {
            // タイマー
            const timeInt = Math.ceil(gameState.timeLeft);
            elements.timerDisplay.textContent = timeInt;
            elements.timerDisplay.classList.toggle('danger', timeInt <= 5);

            // タイマーバー
            const timerPercent = (gameState.timeLeft / CONFIG.GAME_DURATION) * 100;
            elements.timerBar.style.width = timerPercent + '%';
            elements.timerBar.classList.toggle('danger', timerPercent < 25);

            // 利率表示
            const ratePercent = (gameState.rate * 100).toFixed(0);
            elements.rateDisplay.textContent = `${gameState.rate >= 0 ? '+' : ''}${ratePercent}%`;
            elements.rateDisplay.classList.toggle('negative', gameState.rate < 0);

            // バケツの利率表示
            elements.bucketRate.textContent = `${gameState.rate >= 0 ? '+' : ''}${ratePercent}%`;
        }

        // お金フォーマット
        function formatMoney(amount) {
            if (amount >= 100000000) {
                return '¥' + (amount / 100000000).toFixed(2) + '億';
            } else if (amount >= 10000000) {
                return '¥' + (amount / 10000).toFixed(0) + '万';
            } else if (amount >= 10000) {
                return '¥' + Math.floor(amount).toLocaleString();
            } else if (amount >= 100) {
                return '¥' + Math.floor(amount);
            } else {
                return '¥' + amount.toFixed(1);
            }
        }

        // 初期化
        initBucket();
        updateHighscoreDisplay();
        updateUI();
    </script>
</body>
</html>
