<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>複利キャッチャー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ステータス表示 */
        #status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #money {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
        }

        #rate {
            color: #4ade80;
        }

        #rate.negative {
            color: #f87171;
        }

        /* プログレスバー */
        #progress-container {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 落下する数字 */
        .falling-number {
            position: absolute;
            padding: 15px 20px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            text-align: center;
            min-width: 70px;
        }

        .falling-number.positive {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #fff;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
        }

        .falling-number.negative {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.4);
        }

        .falling-number.bonus {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.6);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .falling-number:active {
            transform: scale(0.9);
        }

        /* キャッチエフェクト */
        .catch-effect {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
        }

        .catch-effect.positive {
            color: #4ade80;
        }

        .catch-effect.negative {
            color: #f87171;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.5);
            }
        }

        /* 画面 */
        #start-screen, #result-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }

        #start-screen h1 {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #start-screen .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        #start-screen .rules {
            text-align: left;
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 2;
        }

        .rules span.positive { color: #4ade80; }
        .rules span.negative { color: #f87171; }
        .rules span.bonus { color: #ffd700; }

        .btn {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* リザルト画面 */
        #result-screen h2 {
            font-size: 32px;
            color: #ffd700;
            margin-bottom: 30px;
        }

        #result-screen .result-money {
            font-size: 42px;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #result-screen .result-time {
            font-size: 24px;
            color: #fff;
            margin-bottom: 10px;
        }

        #result-screen .result-rate {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
        }

        #result-screen .message {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .hidden {
            display: none !important;
        }

        /* 複利増加アニメーション */
        #money.growing {
            animation: moneyGrow 0.3s ease;
        }

        @keyframes moneyGrow {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 借金状態 */
        #money.debt {
            color: #f87171 !important;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5) !important;
        }

        /* ゲームオーバー表示 */
        #result-screen.gameover h2 {
            color: #f87171;
        }
    </style>
</head>
<body>
    <!-- スタート画面 -->
    <div id="start-screen">
        <h1>複利キャッチャー</h1>
        <p class="subtitle">複利の恐ろしさ、体感しろ。</p>
        <div class="rules">
            <span class="positive">●緑の数字</span> → 利率UP（キャッチしろ）<br>
            <span class="negative">●赤の数字</span> → 利率DOWN（避けろ）<br>
            <span class="bonus">●金の数字</span> → 大チャンス！<br><br>
            目標：<strong style="color:#ffd700">1億円</strong>到達<br>
            落とすと利率が<span class="negative">マイナス</span>になるぞ
        </div>
        <button class="btn btn-start" onclick="startGame()">START</button>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="hidden">
        <h2>CLEAR!</h2>
        <div class="result-money">¥100,000,000</div>
        <div class="result-time">タイム: 00:00</div>
        <div class="result-rate">最終利率: +0%</div>
        <p class="message"></p>
        <button class="btn btn-start" onclick="startGame()">もう一回</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-container">
        <div id="status">
            <div id="money">¥100</div>
            <div id="stats">
                <span id="rate">利率: +0.0%/秒</span>
                <span id="timer">00:00</span>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // ゲーム設定
        const CONFIG = {
            INITIAL_MONEY: 100,
            TARGET_MONEY: 100000000, // 1億円
            INITIAL_RATE: 0.001, // 0.1%/秒
            SPAWN_INTERVAL: 800, // ms
            FALL_SPEED: 2.5, // px/frame
            COMPOUND_INTERVAL: 100, // 複利計算間隔 ms
        };

        // ゲーム状態
        let gameState = {
            money: CONFIG.INITIAL_MONEY,
            rate: CONFIG.INITIAL_RATE,
            isPlaying: false,
            startTime: 0,
            fallingNumbers: [],
            spawnTimer: null,
            compoundTimer: null,
            animationFrame: null,
        };

        // DOM要素
        const elements = {
            startScreen: document.getElementById('start-screen'),
            resultScreen: document.getElementById('result-screen'),
            gameContainer: document.getElementById('game-container'),
            money: document.getElementById('money'),
            rate: document.getElementById('rate'),
            timer: document.getElementById('timer'),
            progressBar: document.getElementById('progress-bar'),
        };

        // ゲーム開始
        function startGame() {
            // リセット
            gameState = {
                money: CONFIG.INITIAL_MONEY,
                rate: CONFIG.INITIAL_RATE,
                isPlaying: true,
                startTime: Date.now(),
                fallingNumbers: [],
                spawnTimer: null,
                compoundTimer: null,
                animationFrame: null,
            };

            // 既存の落下数字を削除
            document.querySelectorAll('.falling-number').forEach(el => el.remove());
            document.querySelectorAll('.catch-effect').forEach(el => el.remove());

            // 画面切り替え
            elements.startScreen.classList.add('hidden');
            elements.resultScreen.classList.add('hidden');

            // UI更新
            updateUI();

            // ゲームループ開始
            gameState.spawnTimer = setInterval(spawnNumber, CONFIG.SPAWN_INTERVAL);
            gameState.compoundTimer = setInterval(applyCompoundInterest, CONFIG.COMPOUND_INTERVAL);
            gameLoop();
        }

        // 数字を生成
        function spawnNumber() {
            if (!gameState.isPlaying) return;

            const gameArea = elements.gameContainer.getBoundingClientRect();
            const statusHeight = document.getElementById('status').offsetHeight;

            // 種類を決定
            const rand = Math.random();
            let type, value;

            if (rand < 0.15) {
                // 15%: ボーナス（大きいプラス）
                type = 'bonus';
                value = Math.floor(Math.random() * 3 + 3); // 3-5%
            } else if (rand < 0.35) {
                // 20%: マイナス
                type = 'negative';
                value = -Math.floor(Math.random() * 2 + 1); // -1 to -2%
            } else {
                // 65%: プラス
                type = 'positive';
                value = Math.floor(Math.random() * 2 + 1); // 1-2%
            }

            // 要素作成
            const el = document.createElement('div');
            el.className = `falling-number ${type}`;
            el.textContent = (value > 0 ? '+' : '') + value + '%';
            el.style.left = Math.random() * (gameArea.width - 80) + 'px';
            el.style.top = statusHeight + 'px';

            // タッチ/クリックイベント
            const catchNumber = (e) => {
                e.preventDefault();
                e.stopPropagation();
                onCatch(el, value, type);
            };

            el.addEventListener('touchstart', catchNumber, { passive: false });
            el.addEventListener('mousedown', catchNumber);

            elements.gameContainer.appendChild(el);

            gameState.fallingNumbers.push({
                element: el,
                value: value,
                type: type,
                y: statusHeight,
            });
        }

        // キャッチ時の処理
        function onCatch(element, value, type) {
            if (!gameState.isPlaying) return;

            const rect = element.getBoundingClientRect();

            // 利率を更新
            gameState.rate += value / 100;

            // エフェクト表示
            showCatchEffect(rect.left + rect.width / 2, rect.top, value, type);

            // 要素削除
            const index = gameState.fallingNumbers.findIndex(n => n.element === element);
            if (index > -1) {
                gameState.fallingNumbers.splice(index, 1);
            }
            element.remove();

            updateUI();
        }

        // キャッチエフェクト
        function showCatchEffect(x, y, value, type) {
            const effect = document.createElement('div');
            effect.className = `catch-effect ${value >= 0 ? 'positive' : 'negative'}`;
            effect.textContent = (value > 0 ? '+' : '') + value + '%';
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';
            elements.gameContainer.appendChild(effect);

            setTimeout(() => effect.remove(), 800);
        }

        // 複利計算
        function applyCompoundInterest() {
            if (!gameState.isPlaying) return;

            // 複利適用（100ms間隔なので、rateを10で割る）
            const intervalRate = gameState.rate / 10;
            gameState.money *= (1 + intervalRate);

            // 破産チェック
            if (gameState.money < 1) {
                endGame(false);
                return;
            }

            // クリアチェック
            if (gameState.money >= CONFIG.TARGET_MONEY) {
                endGame(true);
                return;
            }

            // お金が増えたらアニメーション
            if (gameState.rate > 0) {
                elements.money.classList.add('growing');
                setTimeout(() => elements.money.classList.remove('growing'), 300);
            }

            updateUI();
        }

        // ゲームループ（落下処理）
        function gameLoop() {
            if (!gameState.isPlaying) return;

            const gameArea = elements.gameContainer.getBoundingClientRect();

            gameState.fallingNumbers.forEach((num, index) => {
                num.y += CONFIG.FALL_SPEED;
                num.element.style.top = num.y + 'px';

                // 画面外に落ちた
                if (num.y > gameArea.height) {
                    // 落としたらマイナス（プラスの数字を落とした場合ペナルティ）
                    if (num.value > 0) {
                        gameState.rate -= num.value / 100 * 0.5; // 落としたら半分のペナルティ
                        showCatchEffect(
                            parseFloat(num.element.style.left) + 35,
                            gameArea.height - 50,
                            -num.value * 0.5,
                            'negative'
                        );
                    }
                    num.element.remove();
                    gameState.fallingNumbers.splice(index, 1);
                    updateUI();
                }
            });

            // タイマー更新
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            elements.timer.textContent = `${minutes}:${seconds}`;

            gameState.animationFrame = requestAnimationFrame(gameLoop);
        }

        // UI更新
        function updateUI() {
            // お金表示
            const moneyText = gameState.money >= 100000000
                ? '¥' + (gameState.money / 100000000).toFixed(2) + '億'
                : gameState.money >= 10000
                    ? '¥' + Math.floor(gameState.money).toLocaleString()
                    : '¥' + gameState.money.toFixed(1);

            elements.money.textContent = moneyText;
            elements.money.classList.toggle('debt', gameState.money < CONFIG.INITIAL_MONEY);

            // 利率表示
            const ratePercent = (gameState.rate * 100).toFixed(1);
            elements.rate.textContent = `利率: ${gameState.rate >= 0 ? '+' : ''}${ratePercent}%/秒`;
            elements.rate.classList.toggle('negative', gameState.rate < 0);

            // プログレスバー
            const progress = Math.min(100, (Math.log10(gameState.money) / Math.log10(CONFIG.TARGET_MONEY)) * 100);
            elements.progressBar.style.width = progress + '%';
        }

        // ゲーム終了
        function endGame(isCleared) {
            gameState.isPlaying = false;

            // タイマー停止
            clearInterval(gameState.spawnTimer);
            clearInterval(gameState.compoundTimer);
            cancelAnimationFrame(gameState.animationFrame);

            // 経過時間
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');

            // リザルト画面更新
            const resultScreen = elements.resultScreen;
            resultScreen.classList.toggle('gameover', !isCleared);

            resultScreen.querySelector('h2').textContent = isCleared ? '1億円達成！' : '破産...';
            resultScreen.querySelector('.result-money').textContent =
                isCleared ? '¥100,000,000' : '¥' + Math.max(0, gameState.money).toFixed(0);
            resultScreen.querySelector('.result-time').textContent = `タイム: ${minutes}:${seconds}`;
            resultScreen.querySelector('.result-rate').textContent =
                `最終利率: ${gameState.rate >= 0 ? '+' : ''}${(gameState.rate * 100).toFixed(1)}%/秒`;

            // メッセージ
            let message = '';
            if (isCleared) {
                if (elapsed < 60) {
                    message = '速すぎ！複利マスター！';
                } else if (elapsed < 120) {
                    message = '複利の力、理解したな？';
                } else {
                    message = '最初は地味、後から来る。\nそれが複利。';
                }
            } else {
                message = 'マイナス金利の恐怖...\n借金も複利で増えるぞ。';
            }
            resultScreen.querySelector('.message').textContent = message;

            resultScreen.classList.remove('hidden');
        }

        // 初期化
        updateUI();
    </script>
</body>
</html>
