<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>複利キャッチャー</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* 画面振動 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        @keyframes shakeLight {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .shake { animation: shake 0.4s ease-out; }
        .shake-light { animation: shakeLight 0.2s ease-out; }

        /* 背景エフェクト */
        #bg-effect {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(120, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 200, 0, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 100, 255, 0.05) 0%, transparent 70%);
            z-index: 0;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        /* 音ボタン */
        #sound-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            cursor: pointer;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sound-toggle.muted {
            color: rgba(255,255,255,0.3);
        }

        /* ステータスバー */
        #status {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px 60px 16px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        #stage-indicator {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        #top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #timer-display {
            font-family: 'Orbitron', monospace;
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        #timer-display.danger {
            color: #ff4757;
            animation: pulse 0.3s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); text-shadow: 0 0 30px rgba(255,71,87,0.5); }
            to { transform: scale(1.05); text-shadow: 0 0 50px rgba(255,71,87,0.8); }
        }

        #score-display { text-align: right; }

        #score-label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #score-value {
            font-family: 'Orbitron', monospace;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #score-value.negative {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* プログレスバー */
        #progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d2d3, #54a0ff, #5f27cd);
            background-size: 200% 100%;
            animation: gradientMove 2s linear infinite;
            transition: width 0.1s linear;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        #progress-bar.danger {
            background: linear-gradient(90deg, #ff4757, #ff6b81);
        }

        /* バケツ */
        #bucket {
            position: absolute;
            width: 110px;
            height: 55px;
            background: linear-gradient(180deg, #ffeaa7 0%, #fdcb6e 50%, #f39c12 100%);
            border-radius: 12px 12px 24px 24px;
            border: 3px solid rgba(255,255,255,0.9);
            box-shadow:
                0 0 30px rgba(253, 203, 110, 0.6),
                0 10px 40px rgba(0,0,0,0.4),
                inset 0 2px 10px rgba(255,255,255,0.5),
                inset 0 -10px 20px rgba(0,0,0,0.2);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bucket::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 12px;
            right: 12px;
            height: 10px;
            background: linear-gradient(180deg, #fff 0%, #f1f2f6 100%);
            border-radius: 6px 6px 0 0;
            border: 2px solid rgba(255,255,255,0.8);
            border-bottom: none;
        }

        #bucket-value {
            color: #2d3436;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 14px;
        }

        /* 落下オブジェクト - 視認性UP */
        .falling-item {
            position: absolute;
            padding: 8px 12px;
            border-radius: 12px;
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            min-width: 70px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .falling-item.positive {
            background: linear-gradient(135deg, #00d26a, #00b894);
            color: #fff;
            border: 3px solid #fff;
            box-shadow: 0 4px 20px rgba(0, 210, 106, 0.5);
        }

        .falling-item.negative {
            background: linear-gradient(135deg, #ff3838, #c0392b);
            color: #fff;
            border: 3px solid #ffcccc;
            box-shadow: 0 4px 20px rgba(255, 56, 56, 0.5);
        }

        .falling-item.bonus {
            background: linear-gradient(135deg, #ffd32a, #f0932b);
            color: #000;
            border: 3px solid #fff;
            box-shadow: 0 0 25px rgba(255, 211, 42, 0.7);
            animation: bonusGlow 0.3s infinite alternate;
        }

        @keyframes bonusGlow {
            from { transform: scale(1); box-shadow: 0 0 25px rgba(255, 211, 42, 0.7); }
            to { transform: scale(1.08); box-shadow: 0 0 40px rgba(255, 211, 42, 1); }
        }

        .falling-item.coin {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            color: #2d3436;
            border: 3px solid #f39c12;
            border-radius: 50%;
            width: 58px;
            height: 58px;
            min-width: unset;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
        }

        .falling-item.coin.rare {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: #fff;
            border-color: #fff;
            animation: rareGlow 0.25s infinite alternate;
        }

        @keyframes rareGlow {
            from { box-shadow: 0 0 15px rgba(108, 92, 231, 0.6); }
            to { box-shadow: 0 0 30px rgba(108, 92, 231, 1); }
        }

        .falling-item.coin.legendary {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: #fff;
            border-color: #fff;
            animation: legendaryGlow 0.15s infinite alternate;
        }

        @keyframes legendaryGlow {
            from { transform: scale(1); box-shadow: 0 0 20px rgba(232, 67, 147, 0.8); }
            to { transform: scale(1.1); box-shadow: 0 0 40px rgba(232, 67, 147, 1); }
        }

        .falling-item.bomb {
            background: linear-gradient(135deg, #2d3436, #636e72);
            color: #ff4757;
            border: 3px solid #ff4757;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            min-width: unset;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        /* エフェクト */
        .catch-effect {
            position: absolute;
            pointer-events: none;
            font-family: 'Orbitron', monospace;
            font-size: 26px;
            font-weight: 900;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 200;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .catch-effect.positive { color: #00d26a; }
        .catch-effect.negative { color: #ff3838; }
        .catch-effect.bonus { color: #ffd32a; }
        .catch-effect.coin { color: #fdcb6e; }
        .catch-effect.bomb { color: #ff4757; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
        }

        /* 画面共通 */
        .screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 15, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 30px;
            text-align: center;
        }

        .screen.hidden { display: none !important; }

        /* スタート画面 */
        #start-screen .logo {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        #start-screen .tagline {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 25px;
        }

        #start-screen .highscore {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 25px;
        }

        #start-screen .highscore span {
            color: #ffd700;
            font-family: 'Orbitron', monospace;
        }

        .rules-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 25px;
            max-width: 300px;
        }

        .rules-box h3 {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .rules-box .stage {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .rules-box .stage p {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }

        .rules-box .stage-num {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .btn {
            padding: 16px 50px;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(255, 200, 0, 0.4);
        }

        /* ステージ遷移画面 */
        #stage-transition {
            background: rgba(10, 10, 15, 0.95);
        }

        #stage-transition .stage-number {
            font-family: 'Orbitron', monospace;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        #stage-transition .stage-name {
            font-size: 24px;
            color: #fff;
            margin-bottom: 10px;
        }

        #stage-transition .stage-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }

        /* 成績表示画面 */
        #stage-result {
            background: rgba(10, 10, 15, 0.95);
        }

        #stage-result .result-title {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        #stage-result .result-value {
            font-family: 'Orbitron', monospace;
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d26a, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        #stage-result .result-message {
            font-size: 16px;
            color: #ffd700;
        }

        /* 複利画面 */
        #compound-screen .compound-title {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        #compound-screen .compound-formula {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }

        #compound-screen .compound-money {
            font-family: 'Orbitron', monospace;
            font-size: 44px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            transition: all 0.15s;
        }

        #compound-screen .compound-money.growing {
            transform: scale(1.1);
            color: #00d26a;
        }

        #compound-screen .compound-year {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
        }

        /* 結果画面 */
        #result-screen .result-label {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #result-screen .result-money {
            font-family: 'Orbitron', monospace;
            font-size: 40px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d26a, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        #result-screen .new-record {
            background: linear-gradient(135deg, #f9ca24, #f0932b);
            color: #2d3436;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            animation: pulse 0.5s infinite alternate;
        }

        #result-screen .result-breakdown {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 2;
        }

        #result-screen .result-breakdown span {
            color: #ffd700;
            font-family: 'Orbitron', monospace;
        }

        /* カウントダウン */
        #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', monospace;
            font-size: 100px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
            z-index: 300;
            animation: countPop 0.4s ease-out;
        }

        @keyframes countPop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="bg-effect"></div>

    <!-- 音ボタン -->
    <button id="sound-toggle" onclick="toggleSound()">🔊</button>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <div class="logo">FUKURI CATCHER</div>
        <p class="tagline">複利の力を、体感せよ。</p>
        <p class="highscore">BEST: <span id="highscore-display">¥100</span></p>
        <div class="rules-box">
            <h3>How to Play</h3>
            <div class="stage">
                <span class="stage-num">1</span>
                <p>年率を集める（21秒）</p>
            </div>
            <div class="stage">
                <span class="stage-num">2</span>
                <p>元金を集める（15秒）</p>
            </div>
            <div class="stage">
                <span class="stage-num">3</span>
                <p>10年複利で資産爆増！</p>
            </div>
        </div>
        <button class="btn btn-primary" onclick="startGame()">START</button>
    </div>

    <!-- ステージ遷移画面 -->
    <div id="stage-transition" class="screen hidden">
        <div class="stage-number">1</div>
        <div class="stage-name">年率コレクター</div>
        <div class="stage-desc">緑と金を集めろ。赤は避けろ。</div>
    </div>

    <!-- ステージ成績画面 -->
    <div id="stage-result" class="screen hidden">
        <div class="result-title">STAGE 1 CLEAR!</div>
        <div class="result-value">+0%</div>
        <div class="result-message">年率確定！</div>
    </div>

    <!-- 複利画面 -->
    <div id="compound-screen" class="screen hidden">
        <div class="compound-title">10年複利シミュレーション</div>
        <div class="compound-formula"></div>
        <div class="compound-money">¥100</div>
        <div class="compound-year">0年目</div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="result-label">10年後の資産</div>
        <div class="result-money">¥0</div>
        <div class="new-record hidden">NEW RECORD!</div>
        <div class="result-breakdown"></div>
        <button class="btn btn-primary" onclick="startGame()">RETRY</button>
    </div>

    <!-- カウントダウン -->
    <div id="countdown" class="hidden"></div>

    <!-- ゲーム画面 -->
    <div id="game-container">
        <div id="status">
            <div id="stage-indicator">STAGE 1 - 年率コレクター</div>
            <div id="top-row">
                <div id="timer-display">21</div>
                <div id="score-display">
                    <div id="score-label">RATE</div>
                    <div id="score-value">+0%</div>
                </div>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
        <div id="bucket">
            <span id="bucket-value">+0%</span>
        </div>
    </div>

    <script>
        // ゲーム設定
        const CONFIG = {
            STAGE1_DURATION: 21,
            STAGE2_DURATION: 15,
            COMPOUND_YEARS: 10,
            BUCKET_WIDTH: 110,
            BUCKET_HEIGHT: 55,
            STAGE_TRANSITION_TIME: 2500, // +1秒
            STAGE_RESULT_TIME: 2000,
            S1_SPAWN_INTERVAL: 450,
            S1_FALL_SPEED: 4.5,
            S1_NEGATIVE_RATE: 0.45,
            S1_BONUS_RATE: 0.08,
            S2_SPAWN_INTERVAL: 350,
            S2_FALL_SPEED: 5,
            S2_BOMB_RATE: 0.15,
            S2_RARE_RATE: 0.12,
            S2_LEGENDARY_RATE: 0.03,
        };

        let highScore = parseInt(localStorage.getItem('fukuri-highscore-v2')) || 100;
        let soundEnabled = true;

        // サウンド
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
            document.getElementById('sound-toggle').classList.toggle('muted', !soundEnabled);
        }

        function playSound(type) {
            if (!audioCtx || !soundEnabled) return;

            if (type === 'coin' || type === 'register') {
                // チャリン音 / レジ音
                playCoinSound(type === 'register');
                return;
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'catch':
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'bonus':
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.16);
                    osc.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.24);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
                    break;
                case 'negative':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'bomb':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'compound':
                    osc.frequency.setValueAtTime(440 + Math.random() * 200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                    break;
                case 'countdown':
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'start':
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
                    break;
                case 'clear':
                    // ステージクリア音
                    [523, 659, 784, 1047].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.3);
                    });
                    break;
            }
        }

        function playCoinSound(isRegister) {
            // チャリン音をリアルに
            const t = audioCtx.currentTime;
            [2400, 3200, 2800].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, t + i * 0.03);
                gain.gain.setValueAtTime(isRegister ? 0.15 : 0.1, t + i * 0.03);
                gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.03 + 0.15);
                osc.start(t + i * 0.03);
                osc.stop(t + i * 0.03 + 0.15);
            });

            if (isRegister) {
                // レジの「カチャッ」
                setTimeout(() => {
                    const noise = audioCtx.createOscillator();
                    const noiseGain = audioCtx.createGain();
                    noise.type = 'square';
                    noise.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);
                    noise.frequency.setValueAtTime(150, audioCtx.currentTime);
                    noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    noise.start(); noise.stop(audioCtx.currentTime + 0.05);
                }, 150);
            }
        }

        // 画面振動
        function shake(intensity = 'normal') {
            const container = document.getElementById('game-container');
            container.classList.remove('shake', 'shake-light');
            void container.offsetWidth; // リフロー
            container.classList.add(intensity === 'light' ? 'shake-light' : 'shake');

            // バイブレーション（対応端末のみ）
            if (navigator.vibrate) {
                navigator.vibrate(intensity === 'light' ? 50 : 150);
            }
        }

        // ゲーム状態
        let gameState = {
            stage: 0,
            rate: 0,
            money: 0,
            phase: 'idle',
            timeLeft: 0,
            fallingItems: [],
            bucketX: 0,
            bucketY: 0,
            spawnTimer: null,
            gameTimer: null,
            animationFrame: null,
        };

        const el = {
            startScreen: document.getElementById('start-screen'),
            stageTransition: document.getElementById('stage-transition'),
            stageResult: document.getElementById('stage-result'),
            compoundScreen: document.getElementById('compound-screen'),
            resultScreen: document.getElementById('result-screen'),
            countdown: document.getElementById('countdown'),
            gameContainer: document.getElementById('game-container'),
            stageIndicator: document.getElementById('stage-indicator'),
            timerDisplay: document.getElementById('timer-display'),
            scoreLabel: document.getElementById('score-label'),
            scoreValue: document.getElementById('score-value'),
            progressBar: document.getElementById('progress-bar'),
            bucket: document.getElementById('bucket'),
            bucketValue: document.getElementById('bucket-value'),
            highscoreDisplay: document.getElementById('highscore-display'),
        };

        function init() {
            el.highscoreDisplay.textContent = formatMoney(highScore);
            initBucket();
        }

        function initBucket() {
            gameState.bucketX = (window.innerWidth - CONFIG.BUCKET_WIDTH) / 2;
            gameState.bucketY = window.innerHeight * 0.65;
            updateBucketPosition();
        }

        function updateBucketPosition() {
            el.bucket.style.left = gameState.bucketX + 'px';
            el.bucket.style.top = gameState.bucketY + 'px';
        }

        // バケツ操作
        let isDragging = false, dragStartX = 0, dragStartY = 0, bucketStartX = 0, bucketStartY = 0;

        function handleDragStart(e) {
            if (gameState.phase !== 'playing') return;
            isDragging = true;
            const t = e.type.includes('mouse') ? e : e.touches[0];
            dragStartX = t.clientX; dragStartY = t.clientY;
            bucketStartX = gameState.bucketX; bucketStartY = gameState.bucketY;
        }

        function handleDragMove(e) {
            if (!isDragging || gameState.phase !== 'playing') return;
            e.preventDefault();
            const t = e.type.includes('mouse') ? e : e.touches[0];
            const dx = t.clientX - dragStartX, dy = t.clientY - dragStartY;
            const maxX = window.innerWidth - CONFIG.BUCKET_WIDTH;
            const minY = window.innerHeight * 0.45, maxY = window.innerHeight * 0.85;
            gameState.bucketX = Math.max(0, Math.min(maxX, bucketStartX + dx));
            gameState.bucketY = Math.max(minY, Math.min(maxY, bucketStartY + dy));
            updateBucketPosition();
        }

        function handleDragEnd() { isDragging = false; }

        document.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);
        document.addEventListener('touchstart', handleDragStart, { passive: false });
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);

        function startGame() {
            initAudio();
            gameState = {
                stage: 1, rate: 0, money: 0, phase: 'idle', timeLeft: 0,
                fallingItems: [], bucketX: gameState.bucketX, bucketY: gameState.bucketY,
                spawnTimer: null, gameTimer: null, animationFrame: null,
            };
            document.querySelectorAll('.falling-item, .catch-effect').forEach(e => e.remove());
            el.startScreen.classList.add('hidden');
            el.resultScreen.classList.add('hidden');
            showStageTransition(1, '年率コレクター', '緑と金を集めろ。赤は避けろ。', () => {
                startCountdown(() => startStage1());
            });
        }

        function showStageTransition(num, name, desc, callback) {
            const st = el.stageTransition;
            st.querySelector('.stage-number').textContent = num;
            st.querySelector('.stage-name').textContent = name;
            st.querySelector('.stage-desc').textContent = desc;
            st.classList.remove('hidden');
            setTimeout(() => {
                st.classList.add('hidden');
                callback();
            }, CONFIG.STAGE_TRANSITION_TIME);
        }

        function showStageResult(title, value, message, callback) {
            const sr = el.stageResult;
            sr.querySelector('.result-title').textContent = title;
            sr.querySelector('.result-value').textContent = value;
            sr.querySelector('.result-message').textContent = message;
            sr.classList.remove('hidden');
            playSound('clear');
            setTimeout(() => {
                sr.classList.add('hidden');
                callback();
            }, CONFIG.STAGE_RESULT_TIME);
        }

        function startCountdown(callback) {
            let count = 3;
            el.countdown.classList.remove('hidden');
            el.countdown.textContent = count;
            playSound('countdown');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    el.countdown.textContent = count;
                    el.countdown.style.animation = 'none';
                    el.countdown.offsetHeight;
                    el.countdown.style.animation = 'countPop 0.4s ease-out';
                    playSound('countdown');
                } else {
                    el.countdown.textContent = 'GO!';
                    el.countdown.style.animation = 'none';
                    el.countdown.offsetHeight;
                    el.countdown.style.animation = 'countPop 0.4s ease-out';
                    playSound('start');
                    clearInterval(interval);
                    setTimeout(() => {
                        el.countdown.classList.add('hidden');
                        callback();
                    }, 400);
                }
            }, 600);
        }

        function startStage1() {
            gameState.stage = 1;
            gameState.phase = 'playing';
            gameState.timeLeft = CONFIG.STAGE1_DURATION;
            gameState.rate = 0;
            el.stageIndicator.textContent = 'STAGE 1 - 年率コレクター';
            el.scoreLabel.textContent = 'RATE';
            updateUI();
            gameState.spawnTimer = setInterval(spawnStage1Item, CONFIG.S1_SPAWN_INTERVAL);
            gameState.gameTimer = setInterval(() => updateTimer(endStage1), 100);
            gameLoop();
        }

        function spawnStage1Item() {
            if (gameState.phase !== 'playing') return;
            const statusH = document.getElementById('status').offsetHeight;
            const w = window.innerWidth;
            const count = Math.random() < 0.6 ? 2 : 1;

            for (let i = 0; i < count; i++) {
                const rand = Math.random();
                let type, value, text;

                if (rand < CONFIG.S1_BONUS_RATE) {
                    type = 'bonus';
                    value = Math.floor(Math.random() * 8 + 8);
                    text = '+' + value + '%';
                } else if (rand < CONFIG.S1_BONUS_RATE + CONFIG.S1_NEGATIVE_RATE) {
                    type = 'negative';
                    value = -Math.floor(Math.random() * 6 + 3);
                    text = value + '%';
                } else {
                    type = 'positive';
                    value = Math.floor(Math.random() * 4 + 1);
                    text = '+' + value + '%';
                }

                const item = document.createElement('div');
                item.className = `falling-item ${type}`;
                item.textContent = text;
                const x = Math.random() * (w - 80);
                item.style.left = x + 'px';
                item.style.top = statusH + 'px';
                el.gameContainer.appendChild(item);
                gameState.fallingItems.push({ element: item, type, value, x, y: statusH, width: 70, height: 45 });
            }
        }

        function endStage1() {
            clearTimers();
            document.querySelectorAll('.falling-item').forEach(e => e.remove());
            gameState.fallingItems = [];
            gameState.phase = 'idle';

            // ステージ成績表示
            const rateStr = (gameState.rate >= 0 ? '+' : '') + (gameState.rate * 100).toFixed(1) + '%';
            showStageResult('STAGE 1 CLEAR!', rateStr, '年率確定！', () => {
                showStageTransition(2, '元金ハンター', 'コインを集めろ。爆弾は避けろ。', () => {
                    startCountdown(() => startStage2());
                });
            });
        }

        function startStage2() {
            gameState.stage = 2;
            gameState.phase = 'playing';
            gameState.timeLeft = CONFIG.STAGE2_DURATION;
            gameState.money = 100;
            el.stageIndicator.textContent = 'STAGE 2 - 元金ハンター';
            el.scoreLabel.textContent = 'MONEY';
            updateUI();
            gameState.spawnTimer = setInterval(spawnStage2Item, CONFIG.S2_SPAWN_INTERVAL);
            gameState.gameTimer = setInterval(() => updateTimer(endStage2), 100);
            gameLoop();
        }

        function spawnStage2Item() {
            if (gameState.phase !== 'playing') return;
            const statusH = document.getElementById('status').offsetHeight;
            const w = window.innerWidth;
            const rand = Math.random();
            let type, value, text, extraClass = '';

            if (rand < CONFIG.S2_BOMB_RATE) {
                type = 'bomb'; value = -0.5; text = '💣';
            } else if (rand < CONFIG.S2_BOMB_RATE + CONFIG.S2_LEGENDARY_RATE) {
                type = 'coin'; extraClass = 'legendary';
                value = Math.floor(Math.random() * 50000 + 50000);
                text = '¥' + Math.floor(value/10000) + '万';
            } else if (rand < CONFIG.S2_BOMB_RATE + CONFIG.S2_LEGENDARY_RATE + CONFIG.S2_RARE_RATE) {
                type = 'coin'; extraClass = 'rare';
                value = Math.floor(Math.random() * 9000 + 1000);
                text = '¥' + value;
            } else {
                type = 'coin';
                value = Math.floor(Math.random() * 400 + 100);
                text = '¥' + value;
            }

            const item = document.createElement('div');
            item.className = `falling-item ${type} ${extraClass}`.trim();
            item.textContent = text;
            const x = Math.random() * (w - 60);
            item.style.left = x + 'px';
            item.style.top = statusH + 'px';
            el.gameContainer.appendChild(item);
            gameState.fallingItems.push({
                element: item, type, value, x, y: statusH, extraClass,
                width: type === 'bomb' ? 52 : 58, height: type === 'bomb' ? 52 : 58
            });
        }

        function endStage2() {
            clearTimers();
            document.querySelectorAll('.falling-item').forEach(e => e.remove());
            gameState.fallingItems = [];
            gameState.phase = 'idle';

            // ステージ成績表示
            showStageResult('STAGE 2 CLEAR!', '¥' + gameState.money.toLocaleString(), '元金確定！', () => {
                startCompoundPhase();
            });
        }

        function startCompoundPhase() {
            const cs = el.compoundScreen;
            cs.classList.remove('hidden');
            const rate = gameState.rate;
            const initialMoney = gameState.money;
            cs.querySelector('.compound-formula').textContent =
                `元金 ¥${initialMoney.toLocaleString()} × 年利 ${rate >= 0 ? '+' : ''}${(rate * 100).toFixed(1)}%`;

            let money = initialMoney;
            let year = 0;
            const moneyEl = cs.querySelector('.compound-money');
            const yearEl = cs.querySelector('.compound-year');
            moneyEl.textContent = formatMoney(money);
            yearEl.textContent = year + '年目';

            const interval = setInterval(() => {
                year++;
                money *= (1 + rate);
                playSound('compound');
                moneyEl.textContent = formatMoney(money);
                moneyEl.classList.add('growing');
                setTimeout(() => moneyEl.classList.remove('growing'), 100);
                yearEl.textContent = year + '年目';

                if (year >= CONFIG.COMPOUND_YEARS) {
                    clearInterval(interval);
                    yearEl.textContent = CONFIG.COMPOUND_YEARS + '年後！';
                    playSound('register'); // レジ音
                    setTimeout(() => {
                        cs.classList.add('hidden');
                        showResult(money);
                    }, 1000);
                }
            }, 280);
        }

        function showResult(finalMoney) {
            const isNewRecord = finalMoney > highScore;
            if (isNewRecord) {
                highScore = Math.floor(finalMoney);
                localStorage.setItem('fukuri-highscore-v2', highScore);
                el.highscoreDisplay.textContent = formatMoney(highScore);
            }

            const rs = el.resultScreen;
            rs.querySelector('.result-money').textContent = formatMoney(finalMoney);
            rs.querySelector('.new-record').classList.toggle('hidden', !isNewRecord);
            rs.querySelector('.result-breakdown').innerHTML =
                `元金: <span>¥${gameState.money.toLocaleString()}</span><br>` +
                `年利: <span>${gameState.rate >= 0 ? '+' : ''}${(gameState.rate * 100).toFixed(1)}%</span><br>` +
                `運用: <span>${CONFIG.COMPOUND_YEARS}年</span>`;
            rs.classList.remove('hidden');
        }

        function gameLoop() {
            if (gameState.phase !== 'playing') return;
            const h = window.innerHeight;
            const speed = gameState.stage === 1 ? CONFIG.S1_FALL_SPEED : CONFIG.S2_FALL_SPEED;
            const bucketTop = gameState.bucketY;
            const bucketBottom = bucketTop + CONFIG.BUCKET_HEIGHT;
            const bucketLeft = gameState.bucketX;
            const bucketRight = bucketLeft + CONFIG.BUCKET_WIDTH;

            for (let i = gameState.fallingItems.length - 1; i >= 0; i--) {
                const item = gameState.fallingItems[i];
                item.y += speed;
                item.element.style.top = item.y + 'px';
                const itemCX = item.x + item.width / 2;
                const itemBottom = item.y + item.height;

                if (itemBottom >= bucketTop && itemBottom <= bucketBottom + 15) {
                    if (itemCX >= bucketLeft && itemCX <= bucketRight) {
                        onCatch(item, i);
                        continue;
                    }
                }

                if (item.y > h) {
                    item.element.remove();
                    gameState.fallingItems.splice(i, 1);
                }
            }
            gameState.animationFrame = requestAnimationFrame(gameLoop);
        }

        function onCatch(item, index) {
            let shouldShake = false;
            let shakeIntensity = 'light';

            if (gameState.stage === 1) {
                gameState.rate += item.value / 100;
                if (item.type === 'bonus') {
                    playSound('bonus');
                    shouldShake = true;
                } else if (item.type === 'negative') {
                    playSound('negative');
                } else {
                    playSound('catch');
                }
            } else {
                if (item.type === 'bomb') {
                    gameState.money = Math.floor(gameState.money * 0.5);
                    playSound('bomb');
                    shouldShake = true;
                    shakeIntensity = 'normal';
                } else {
                    gameState.money += item.value;
                    playSound('coin');
                    // レジェンダリーで振動
                    if (item.extraClass === 'legendary') {
                        shouldShake = true;
                    }
                }
            }

            if (shouldShake) shake(shakeIntensity);
            showCatchEffect(item);
            item.element.remove();
            gameState.fallingItems.splice(index, 1);
            updateUI();
        }

        function showCatchEffect(item) {
            const effect = document.createElement('div');
            effect.className = `catch-effect ${item.type}`;
            if (gameState.stage === 1) {
                effect.textContent = (item.value > 0 ? '+' : '') + item.value + '%';
            } else {
                effect.textContent = item.type === 'bomb' ? '-50%' : '+¥' + item.value.toLocaleString();
            }
            effect.style.left = (item.x + item.width / 2) + 'px';
            effect.style.top = item.y + 'px';
            el.gameContainer.appendChild(effect);
            setTimeout(() => effect.remove(), 600);
        }

        function updateTimer(endCallback) {
            gameState.timeLeft -= 0.1;
            if (gameState.timeLeft <= 0) { gameState.timeLeft = 0; endCallback(); }
            updateUI();
        }

        function updateUI() {
            const duration = gameState.stage === 1 ? CONFIG.STAGE1_DURATION : CONFIG.STAGE2_DURATION;
            const timeInt = Math.ceil(gameState.timeLeft);
            el.timerDisplay.textContent = timeInt;
            el.timerDisplay.classList.toggle('danger', timeInt <= 5);
            const pct = (gameState.timeLeft / duration) * 100;
            el.progressBar.style.width = pct + '%';
            el.progressBar.classList.toggle('danger', pct < 25);

            if (gameState.stage === 1) {
                const rateStr = (gameState.rate * 100).toFixed(0);
                el.scoreValue.textContent = (gameState.rate >= 0 ? '+' : '') + rateStr + '%';
                el.scoreValue.classList.toggle('negative', gameState.rate < 0);
                el.bucketValue.textContent = (gameState.rate >= 0 ? '+' : '') + rateStr + '%';
            } else {
                el.scoreValue.textContent = '¥' + gameState.money.toLocaleString();
                el.scoreValue.classList.remove('negative');
                el.bucketValue.textContent = '¥' + (gameState.money >= 10000 ? Math.floor(gameState.money/10000) + '万' : gameState.money);
            }
        }

        function clearTimers() {
            clearInterval(gameState.spawnTimer);
            clearInterval(gameState.gameTimer);
            cancelAnimationFrame(gameState.animationFrame);
        }

        function formatMoney(amount) {
            if (amount >= 100000000) return '¥' + (amount / 100000000).toFixed(2) + '億';
            if (amount >= 10000) return '¥' + Math.floor(amount).toLocaleString();
            return '¥' + Math.floor(amount);
        }

        init();
    </script>
</body>
</html>
